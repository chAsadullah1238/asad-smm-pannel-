<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asad SMM Panel</title><link rel="stylesheet" href="style.css">
</head><body>
<header><b>ASAD SMM</b><span>Working Demo</span></header><main>
<section class="hero"><div><small>WELCOME BACK</small><h1>Grow your social presence</h1><p>Simple and professional order management.</p></div><button onclick="document.getElementById('order').scrollIntoView()">+ New Order</button></section>
<section class="stats">
<div><label>Balance</label><strong>$0.00</strong></div><div><label>Total Orders</label><strong id="total">0</strong></div>
<div><label>Completed</label><strong id="completed">0</strong></div><div><label>Services</label><strong>5</strong></div></section>
<section id="order" class="card"><h2>New Order</h2>
<form id="orderForm"><label>Service</label>
<select id="service" required><option>WhatsApp Marketing</option><option>WhatsApp Poll / Survey</option><option>TikTok Marketing</option><option>Instagram Marketing</option><option>Facebook Marketing</option><option>Social Media Management</option></select>
<label>Link / Contact</label><input id="link" placeholder="Enter your authorized page/link" required>
<label>Quantity</label><input id="qty" type="number" min="1" placeholder="e.g. 100" required>
<button class="primary" type="submit">Place Order</button><p id="msg"></p></form></section>
<section class="card"><h2>Recent Orders</h2><div id="orders">No orders yet.</div></section>
</main>
<script>
const KEY="asad_smm_orders"; let orders=JSON.parse(localStorage.getItem(KEY)||"[]");
function render(){document.getElementById("total").textContent=orders.length;
document.getElementById("completed").textContent=orders.filter(x=>x.status==="Completed").length;
const box=document.getElementById("orders"); if(!orders.length){box.textContent="No orders yet.";return;}
box.innerHTML=orders.map(x=>`<div class="order"><b>#${x.id}</b><br>${x.service}<br><small>${x.link} • Qty: ${x.qty}</small><br><span>${x.status}</span></div>`).join("");}
document.getElementById("orderForm").addEventListener("submit",e=>{e.preventDefault();
const id=Date.now().toString().slice(-8); const item={id,service:service.value,link:link.value.trim(),qty:qty.value,status:"Pending"};
orders.unshift(item);localStorage.setItem(KEY,JSON.stringify(orders));render();msg.textContent="Order #"+id+" created successfully.";e.target.reset();}); render();
</script></body></html>
